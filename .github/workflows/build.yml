name: Build

# Reusable build+test matrix. Called by ci.yml (PRs) and release.yml (main/dispatch)
# so the platform matrix lives in exactly one place.

on:
  workflow_call:
    inputs:
      upload-artifacts:
        description: 'Upload built binaries as workflow artifacts (needed by callers that publish)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # `features` is what the published binary is built with, where a row needs one. The
          # macOS row needs the opposite — see the macOS build step, which drops the daemon's
          # default `secure-enclave`. `file` is compiled and tested on this row but never
          # built into target/release.
          - os: macos-latest        # Apple Silicon (M-series)
            platform: macos-aarch64

          # The whole shipped Linux set: one portable pair per architecture plus a
          # `-tpm` sibling, built on manylinux2014 so the glibc floor is 2.17.
          # That floor is what let these four replace the eight per-distro rows
          # and the two AL2 rows they grew out of — it is below AL2's 2.26, so one
          # binary covers every host those artifacts reached and then some. See
          # docs/design/tpm-linux-artifact.md.
          #
          # `image` rather than `container`: the row runs the job on the host and
          # invokes docker itself, because the runner's JS actions need glibc 2.28
          # and manylinux2014 has 2.17. See the "build and test" step.
          #
          # `glibc_floor` is what makes the claim checkable. Without that
          # assertion a row proves only that the tree compiles somewhere old,
          # and a newer symbol picked up from the toolchain would ship.
          - os: ubuntu-24.04
            platform: linux-x64
            image: quay.io/pypa/manylinux2014_x86_64@sha256:e6a785657009c612fe2a85fa933051d03a50ba62b1c5e47d62abcab546a2e423 # 2026-11-17
            glibc_floor: '2.17'

          - os: ubuntu-24.04-arm
            platform: linux-aarch64
            image: quay.io/pypa/manylinux2014_aarch64@sha256:c2995cae5e2d433fbe757d1466486727b3edd68ba644cd60df253365f35fda9e # 2026-11-17
            glibc_floor: '2.17'

          # `bootstrap` runs inside the container and builds tpm2-tss, because the
          # image has no package manager that still works. `host_bootstrap` runs
          # on the runner, because the assertion steps below read the binary from
          # the host and a tpm-linked daemon will not start without libtss2 there.
          - os: ubuntu-24.04
            platform: linux-x64-tpm
            image: quay.io/pypa/manylinux2014_x86_64@sha256:e6a785657009c612fe2a85fa933051d03a50ba62b1c5e47d62abcab546a2e423 # 2026-11-17
            bootstrap: ./scripts/manylinux-toolchain.sh
            host_bootstrap: sudo apt-get update -qq && sudo apt-get install -y -qq libtss2-dev
            tpm: true
            glibc_floor: '2.17'

          - os: ubuntu-24.04-arm
            platform: linux-aarch64-tpm
            image: quay.io/pypa/manylinux2014_aarch64@sha256:c2995cae5e2d433fbe757d1466486727b3edd68ba644cd60df253365f35fda9e # 2026-11-17
            bootstrap: ./scripts/manylinux-toolchain.sh
            host_bootstrap: sudo apt-get update -qq && sudo apt-get install -y -qq libtss2-dev
            tpm: true
            glibc_floor: '2.17'

    steps:
      # Runner-side, for `image` rows whose container bootstrap cannot reach the
      # host the later assertion steps run the binary on. Every Linux row is an
      # `image` row now, so there is no in-job bootstrap: a row's own bootstrap
      # runs inside the docker invocation.
      - name: install host prerequisites
        if: matrix.host_bootstrap
        run: ${{ matrix.host_bootstrap }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Skipped for `image` rows: the cargo home being populated lives inside the
      # container, not in the host paths this would save.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !matrix.image }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.platform }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.platform }}-cargo-

      # Two invocations for the same reason the tpm row needs them, with the opt-out on the
      # other side. The published daemon drops `secure-enclave`: this artifact's supported
      # path is `credsd install --user`, whose keystore is the data protection keychain the
      # bundle's provisioning profile authorizes, and a LaunchDaemon can never reach that
      # keychain — so compiling the enclave in would make `sudo credsd install` resolve a
      # backend and look supported. The client keeps the feature, which is what signs a
      # presence challenge with Touch ID.
      - name: build (macos)
        if: ${{ !matrix.image && !matrix.tpm && startsWith(matrix.os, 'macos') }}
        run: |
          cargo build --release --locked -p credsd-daemon --no-default-features
          cargo build --release --locked -p creds

      - name: test
        if: ${{ !matrix.image && !matrix.tpm }}
        env:
          FEATURES: ${{ matrix.features }}
        run: cargo test --locked ${FEATURES:+--features "$FEATURES"}

      # The macOS `test` step already covers `secure-enclave`, which is in the default set: the
      # shim links, the build script runs, and the feature-gated code passes against the fake
      # seam. Nothing there asserts anything about the enclave itself — `hardware_round_trip`
      # stays `#[ignore]`d because these runners are virtualized and expose none. The published
      # daemon is the one build that drops it.
      #
      # This step adds `file`, which the published macOS binary omits, so its macOS paths are
      # compiled and tested somewhere. Test only, never `build --release`: a release build here
      # would overwrite target/release with a binary that ships `file`. A step rather than a
      # matrix row because macOS minutes bill at 10x. `startsWith` so a second macOS row is
      # covered without editing this condition.
      - name: test (secure-enclave, file)
        if: startsWith(matrix.os, 'macos')
        run: cargo test --locked --features secure-enclave,file

      # manylinux2014 cannot host the workflow's JS actions: the runner forces
      # them onto Node 24, which needs glibc 2.28, and the image has 2.17 — the
      # very floor these rows exist to hold. So the host runs the actions and
      # docker runs only cargo, against a real glibc 2.17 userland.
      #
      # The container runs as root, so target/ comes back root-owned; chown it so
      # later host steps (the assertions, artifact upload, cleanup) can read and
      # remove it.
      #
      # The tpm branch splits the build for the reason decision 3 of
      # docs/design/tpm-linux-artifact.md gives, and points pkg-config at the
      # prefix matrix.bootstrap installed.
      - name: build and test (${{ matrix.platform }})
        if: matrix.image
        env:
          TPM: ${{ matrix.tpm }}
        run: |
          docker run --rm -v "$PWD":/w -w /w -e CARGO_TERM_COLOR=always -e TPM \
            ${{ matrix.image }} sh -euc '
              ${{ matrix.bootstrap }}
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs \
                | sh -s -- -y --profile minimal --no-modify-path --default-toolchain none
              . "$HOME/.cargo/env"
              if [ "${TPM:-}" = true ]; then
                export PKG_CONFIG_PATH=/opt/tss/lib/pkgconfig
                export LD_LIBRARY_PATH=/opt/tss/lib
                cargo build --release --locked -p credsd-daemon --features tpm
                cargo build --release --locked -p creds
                cargo test --locked -p credsd-core --features tpm
              else
                cargo build --release --locked
                cargo test --locked
              fi
            '
          sudo chown -R "$(id -u):$(id -g)" target

      # Read off the binary rather than inferred from the build command, like the tpm linkage
      # check below. The macOS list is exact: an extra backend in the official build is the
      # regression this exists to catch. Linux must always carry `file`, the only backend with
      # no hardware prerequisite.
      - name: assert storage backends
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          line="$(target/release/credsd --version | grep '^storage backends: ')"
          fail() { echo "::error::$PLATFORM: $1 (got '$line')"; exit 1; }
          case "$RUNNER_OS" in
            macOS)
              [ "$line" = "storage backends: data-protection-keychain" ] \
                || fail "macOS build must ship exactly data-protection-keychain"
              ;;
            Linux)
              grep -qw file <<<"$line" || fail "Linux build must ship the file backend"
              ;;
          esac

      # The claim a portable row exists to make, read off the binary rather than
      # inferred from the image it was built in. Both halves fail a build that
      # looks green: a newer symbol picked up from the toolchain only fails on the
      # oldest host a customer has, and a RUNPATH left by the tpm2-tss prefix
      # sends the loader to a build-machine path — which on a host where that
      # path is creatable is somewhere to plant a library.
      #
      # Non-weak symbols only. Rust std references statx, getrandom, gettid and
      # others weakly and falls back to a syscall when the host lacks them, so a
      # weak reference above the floor is not a floor.
      - name: assert build-host independence
        if: matrix.glibc_floor
        env:
          PLATFORM: ${{ matrix.platform }}
          FLOOR: ${{ matrix.glibc_floor }}
        run: |
          set -euo pipefail
          for binary in creds credsd; do
            path="target/release/$binary"
            highest=$(readelf -W --dyn-syms "$path" \
              | awk '$7=="UND" && $8 ~ /@GLIBC_/ && $5!="WEAK" {split($8,a,"@"); print a[2]}' \
              | sed 's/^GLIBC_//' | sort -uV | tail -1)
            if [ -n "$highest" ] \
               && [ "$(printf '%s\n%s\n' "$highest" "$FLOOR" | sort -V | tail -1)" != "$FLOOR" ]; then
              echo "::error::$PLATFORM: $binary needs glibc $highest, above the $FLOOR floor"
              exit 1
            fi
            paths=$(objdump -p "$path" | awk '$1=="RUNPATH" || $1=="RPATH" {print $2}')
            if [ -n "$paths" ]; then
              echo "::error::$PLATFORM: $binary carries RUNPATH/RPATH $paths"
              exit 1
            fi
            echo "$binary: glibc floor ${highest:-none}, no RUNPATH"
          done

      # `if-no-files-found: error` cannot catch a *partial* set: it fires only when nothing
      # matches, so an artifact holding the daemon and no client still uploads green. That is
      # exactly how a release shipped `credsd` alone. Assert each binary by name instead.
      - name: verify release binaries
        if: inputs.upload-artifacts
        run: |
          for binary in credsd creds; do
            test -x "target/release/$binary" \
              || { echo "::error::target/release/$binary is missing"; exit 1; }
          done

      # The claim the `-tpm` artifacts exist to make, read off the binary rather than inferred
      # from the build command: whether an unused `libtss2` survives into a link depends on
      # --as-needed and dead-object elimination, which vary by toolchain and distro. `creds` is
      # checked on every row because it must never link tpm2-tss, whatever the row built.
      # Linux-gated because macOS has no `ldd`, but NOT gated on upload-artifacts: every Linux
      # row has both binaries built by here, and a pull request is where a leaked link should
      # be caught rather than on the push that would publish it.
      - name: assert tpm2-tss linkage
        if: runner.os == 'Linux'
        env:
          PLATFORM: ${{ matrix.platform }}
          TPM: ${{ matrix.tpm }}
        run: |
          set -euo pipefail
          # Via a variable, so `ldd` failing aborts the step: grepping the empty output of a
          # failed `ldd` would read as "links nothing" and pass three of these four checks.
          credsd_libs="$(ldd target/release/credsd)"
          creds_libs="$(ldd target/release/creds)"
          fail() { echo "::error::$PLATFORM: $1"; exit 1; }
          if [ "$TPM" = "true" ]; then
            grep -q libtss2-esys <<<"$credsd_libs" || fail "credsd does not link libtss2-esys"
          elif grep -q libtss2 <<<"$credsd_libs"; then
            fail "credsd links libtss2"
          fi
          if grep -q libtss2 <<<"$creds_libs"; then
            fail "creds links libtss2"
          fi

      # Recorded here, on the machine that produced the binary, and in hex.
      # macOS runners ship no `sha256sum` and the AL2 container ships no
      # `shasum`, so take whichever the row has.
      - name: record binary digests
        if: inputs.upload-artifacts
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          hex() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$1" | cut -d' ' -f1
            else
              shasum -a 256 "$1" | cut -d' ' -f1
            fi
          }
          mkdir -p digests
          printf '{"%s":{"creds":"%s","credsd":"%s"}}\n' \
            "$PLATFORM" "$(hex target/release/creds)" "$(hex target/release/credsd)" \
            > "digests/$PLATFORM.json"
          cat "digests/$PLATFORM.json"

      # Matrix job outputs cannot be aggregated across legs in Actions, so each leg's
      # digests travel to the manifest job as their own small artifact.
      - name: upload digests
        if: inputs.upload-artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.platform }}
          path: digests/${{ matrix.platform }}.json
          if-no-files-found: error

      # Both binaries: `credsd` is the daemon, `creds` the client every user-facing command runs
      # through. Shipping either alone ships nothing usable. release.yml uploads whatever each
      # artifact contains, so it needs no matching change.
      - name: upload artifact
        if: inputs.upload-artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries-${{ matrix.platform }}
          path: |
            target/release/credsd
            target/release/creds
          if-no-files-found: error
