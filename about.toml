# Third-party attribution for the shipped binaries: `cargo about generate --all-features --locked
# --workspace -o THIRD-PARTY-LICENSES.md about.hbs`. CI regenerates it and fails on drift.
# A license missing from `accepted` fails generation; adding one is a legal decision, not a fix.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]
# Shipped platforms only; a dependency gated to another target is not in any binary.
targets = [
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]
# Test-only crates (mockito pulls MPL-2.0 `colored`) never reach a binary.
ignore-dev-dependencies = true
ignore-build-dependencies = false
# Our own crates are not third-party.
private = { ignore = true }

# Pinned to upstream's own LICENSE, whole rather than sliced per term: `cargo about` otherwise
# renders the SPDX ISC template, whose copyright line is a placeholder, and these crates keep
# their notices outside any license section. A version bump changes the checksum and fails here.
[aws-lc-rs.clarify]
license = "ISC AND (Apache-2.0 OR ISC)"

[[aws-lc-rs.clarify.files]]
path = "LICENSE"
checksum = "b50b376e7d24a0598488b730c3034ffcd0b58dd36c0913a24b9903a3cfd04bf7"

[aws-lc-sys.clarify]
license = "ISC AND (Apache-2.0 OR ISC) AND Apache-2.0 AND MIT AND BSD-3-Clause AND (Apache-2.0 OR ISC OR MIT) AND (Apache-2.0 OR ISC OR MIT-0)"

[[aws-lc-sys.clarify.files]]
path = "LICENSE"
checksum = "728536b4160e051f86d7c9c388f704866b3d512cd7df97ac3516c65279523c4e"
